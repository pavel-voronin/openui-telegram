name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 04:00 Asia/Shanghai (Sunday 20:00 UTC).
    - cron: '0 20 * * 0'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.15.0', '22', '24.0.0', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run check:package
  publish:
    name: npm publication
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/, 'Only stable versions are published to latest');
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json version');
          NODE
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check npm publication without publishing
        # Permit checking an existing version; --dry-run still prevents publication.
        run: npm publish --dry-run --force --loglevel=verbose
      - name: Publish to npm using OIDC
        if: github.event_name == 'push'
        run: npm publish
